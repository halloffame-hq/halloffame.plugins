name: Publish

# Publishes workspace packages to npm, by hand or when a GitHub release is
# published, then commits the published versions to package.json.
#
# - A manual run publishes the chosen package at the given version.
# - A release tag such as "@hallofame/cli@0.1.29" or "cli@v0.1.29" publishes that package.
# - A plain release tag such as "v1.5.0" publishes every package, each bumped from its
#   own version by the part (major, minor or patch) that went up since the previous
#   plain release tag. A prerelease tag such as "v2.0.0-beta.1" gives each package that
#   bump with the same prerelease suffix.
#
# Prereleases go to the "next" dist-tag and are not committed back.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - '@hallofame/capacitor-native'
          - '@hallofame/cli'
          - '@hallofame/payment-provider-paystack'
          - '@hallofame/cloudflare-agent'
      version:
        description: Version to publish, such as 1.2.3 or 1.3.0-beta.1
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Plan release
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
        run: node .github/scripts/release-plan.mjs

      - run: pnpm install --frozen-lockfile

      - name: Set package versions
        run: node .github/scripts/release-plan.mjs apply

      # Every package passes its gate and packs before any of them is published.
      - name: Check and pack
        run: |
          while IFS=$'\t' read -r name dir version; do
            echo "::group::$name@$version"
            (cd "$dir" && pnpm check && pnpm pack --pack-destination "$RUNNER_TEMP/pack")
            echo "::endgroup::"
          done < "$RUNNER_TEMP/release-plan.tsv"

      # A version that is already on npm is skipped, so a failed run can be re-run.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          while IFS=$'\t' read -r name dir version; do
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi

            tarball="$RUNNER_TEMP/pack/$(echo "${name#@}" | tr / -)-$version.tgz"
            npm publish "$tarball" --access public --provenance --tag "$DIST_TAG"
          done < "$RUNNER_TEMP/release-plan.tsv"

      - name: Commit versions
        if: steps.plan.outputs.commit == 'true' && (github.event_name == 'release' || github.ref_type == 'branch')
        env:
          BRANCH: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref_name }}
          LABEL: ${{ steps.plan.outputs.label }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          git checkout -- .
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"

          node .github/scripts/release-plan.mjs apply

          if git diff --quiet; then
            echo "package.json versions are already up to date"
            exit 0
          fi

          git config user.name "$ACTOR"
          git config user.email "$ACTOR_ID+$ACTOR@users.noreply.github.com"
          git commit -am "chore: release $LABEL" -m "$(cut -f1,3 --output-delimiter=@ "$RUNNER_TEMP/release-plan.tsv")"
          git push origin "$BRANCH"
